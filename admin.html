<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cash Flow Bank — Admin</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
html.dark body{background:#0f172a;color:#e5e7eb}
.dark .card{background:#1e293b;border-color:#334155}
.dark input,.dark select{background:#0f172a;color:white;border-color:#475569}
.dark .muted{color:#94a3b8}
</style>
</head>

<body class="bg-gray-100 text-gray-900 min-h-screen">

<!-- LOGIN -->
<div id="loginPage" class="min-h-screen flex items-center justify-center p-5">
  <div class="card bg-white border rounded-2xl shadow-xl p-6 w-full max-w-md">
    <h1 class="text-3xl font-bold text-green-700">Cash Flow Bank</h1>
    <p class="muted text-gray-500 mb-6">Admin Panel</p>

    <input id="email" type="email" placeholder="Admin email"
      class="w-full border rounded-xl p-3 mb-3">

    <input id="password" type="password" placeholder="Password"
      class="w-full border rounded-xl p-3 mb-4">

    <button onclick="login()"
      class="w-full bg-green-600 text-white p-3 rounded-xl font-semibold">
      Sign In
    </button>

    <p id="loginError" class="text-red-500 text-sm mt-4"></p>
  </div>
</div>


<!-- ADMIN -->
<div id="adminPage" class="hidden">

<header class="bg-green-700 text-white p-4 flex justify-between items-center">
  <div>
    <h1 class="font-bold text-xl">Cash Flow Bank</h1>
    <p class="text-xs opacity-80">ADMIN PANEL</p>
  </div>

  <div class="flex gap-2">
    <button onclick="lightMode()" class="bg-white text-gray-800 px-3 py-2 rounded-lg">
      ☀️
    </button>
    <button onclick="darkMode()" class="bg-gray-900 text-white px-3 py-2 rounded-lg">
      🌙
    </button>
    <button onclick="logout()" class="bg-red-500 px-3 py-2 rounded-lg">
      Logout
    </button>
  </div>
</header>


<main class="max-w-6xl mx-auto p-4">

  <!-- DASHBOARD -->
  <section class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">

    <div class="card bg-white border rounded-xl p-4">
      <p class="muted text-gray-500 text-sm">Customers</p>
      <h2 id="customerCount" class="text-2xl font-bold">0</h2>
    </div>

    <div class="card bg-white border rounded-xl p-4">
      <p class="muted text-gray-500 text-sm">Pending</p>
      <h2 id="pendingCount" class="text-2xl font-bold text-orange-500">0</h2>
    </div>

    <div class="card bg-white border rounded-xl p-4">
      <p class="muted text-gray-500 text-sm">Accounts</p>
      <h2 id="accountCount" class="text-2xl font-bold">0</h2>
    </div>

    <div class="card bg-white border rounded-xl p-4">
      <p class="muted text-gray-500 text-sm">Transactions</p>
      <h2 id="transactionCount" class="text-2xl font-bold">0</h2>
    </div>

  </section>


  <!-- CUSTOMERS -->
  <section class="card bg-white border rounded-2xl p-4">

    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold">Customers</h2>

      <button onclick="loadData()"
        class="bg-green-600 text-white px-4 py-2 rounded-lg">
        Refresh
      </button>
    </div>

    <div id="customers" class="space-y-3">
      Loading...
    </div>

  </section>

</main>
</div>


<!-- CUSTOMER MODAL -->
<div id="modal"
 class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4">

  <div class="card bg-white rounded-2xl p-5 w-full max-w-md">

    <div class="flex justify-between mb-4">
      <h2 id="modalTitle" class="text-xl font-bold">Customer</h2>
      <button onclick="closeModal()">✕</button>
    </div>

    <div id="modalBody"></div>

  </div>
</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signOut,
  setPersistence,
  browserLocalPersistence
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  getDocs,
  collection,
  query,
  where,
  updateDoc,
  deleteDoc,
  addDoc,
  serverTimestamp,
  Timestamp,
  runTransaction
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {
  apiKey: "AIzaSyAVd2DY_EgwutXbqPdcFNsj4LJG-5e5zjw",
  authDomain: "bank-d221d.firebaseapp.com",
  projectId: "bank-d221d",
  storageBucket: "bank-d221d.firebasestorage.app",
  messagingSenderId: "17227399657",
  appId: "1:17227399657:web:cc4e711a2fe110235c4b78"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let customers = [];
let accounts = [];


/* THEME */

function lightMode(){
  document.documentElement.classList.remove("dark");
  localStorage.setItem("cfb-theme","light");
}

function darkMode(){
  document.documentElement.classList.add("dark");
  localStorage.setItem("cfb-theme","dark");
}

if(localStorage.getItem("cfb-theme")==="dark"){
  document.documentElement.classList.add("dark");
}else{
  document.documentElement.classList.remove("dark");
}

window.lightMode = lightMode;
window.darkMode = darkMode;


/* LOGIN */

window.login = async function(){

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  document.getElementById("loginError").textContent = "";

  if(!email || !password){
    document.getElementById("loginError").textContent =
      "Enter your email and password.";
    return;
  }

  try{

    await setPersistence(auth,browserLocalPersistence);

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    document.getElementById("loginError").textContent =
      error.message;

  }

};


/* AUTH */

onAuthStateChanged(auth,async(user)=>{

  if(!user){

    document.getElementById("loginPage").classList.remove("hidden");
    document.getElementById("adminPage").classList.add("hidden");
    return;

  }

  try{

    const adminRef = doc(db,"admins",user.uid);
    const adminSnap = await getDoc(adminRef);

    if(
      !adminSnap.exists() ||
      adminSnap.data().active !== true
    ){

      alert("Access denied. You are not an active admin.");
      await signOut(auth);
      return;
    }

    currentUser = user;

    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("adminPage").classList.remove("hidden");

    loadData();

  }catch(error){

    alert("Admin check failed: " + error.message);

  }

});


/* LOGOUT */

window.logout = function(){
  signOut(auth);
};


/* LOAD DATA */

window.loadData = async function(){

  try{

    const userSnap = await getDocs(collection(db,"users"));
    const accountSnap = await getDocs(collection(db,"accounts"));
    const transactionSnap = await getDocs(collection(db,"transactions"));

    customers = userSnap.docs.map(x=>({
      id:x.id,
      ...x.data()
    }));

    accounts = accountSnap.docs.map(x=>({
      id:x.id,
      ...x.data()
    }));

    document.getElementById("customerCount").textContent =
      customers.length;

    document.getElementById("pendingCount").textContent =
      customers.filter(x=>String(x.status||"PENDING").toUpperCase()==="PENDING").length;

    document.getElementById("accountCount").textContent =
      accounts.length;

    document.getElementById("transactionCount").textContent =
      transactionSnap.size;

    renderCustomers();

  }catch(error){

    document.getElementById("customers").innerHTML =
      `<p class="text-red-500">${escapeHtml(error.message)}</p>`;

  }

};


/* CUSTOMERS */

function renderCustomers(){

  const box = document.getElementById("customers");

  if(!customers.length){
    box.innerHTML =
      `<p class="muted text-gray-500">No customers found.</p>`;
    return;
  }

  box.innerHTML = customers.map(c=>{

    const status =
      String(c.status || "PENDING").toUpperCase();

    let badge = "bg-gray-200 text-gray-700";

    if(status==="ACTIVE")
      badge="bg-green-100 text-green-700";

    if(status==="PENDING")
      badge="bg-orange-100 text-orange-700";

    if(status==="DECLINED")
      badge="bg-red-100 text-red-700";

    const account = accounts.find(
      a=>a.userId===c.id
    );

    return `

    <div class="border rounded-xl p-4">

      <div class="flex justify-between gap-3">

        <div class="min-w-0">

          <h3 class="font-bold truncate">
            ${escapeHtml(c.fullName || "Unnamed")}
          </h3>

          <p class="text-sm muted text-gray-500 truncate">
            ${escapeHtml(c.email || "")}
          </p>

          <p class="text-xs mt-1">
            ${escapeHtml(c.accountNumber || "No account number")}
          </p>

          <span class="inline-block mt-2 px-2 py-1 rounded-full text-xs ${badge}">
            ${status}
          </span>

        </div>

        <div class="text-right">

          <p class="font-bold">
            ${account ? money(account.balance) : "$0.00"}
          </p>

          <p class="text-xs muted text-gray-500">
            ${account ? escapeHtml(account.type || "Account") : "No account"}
          </p>

        </div>

      </div>

      <div class="grid grid-cols-2 md:grid-cols-5 gap-2 mt-4">

        ${status==="PENDING" ? `
        <button onclick="approveCustomer('${c.id}')"
          class="bg-green-600 text-white p-2 rounded-lg text-sm">
          Approve
        </button>

        <button onclick="declineCustomer('${c.id}')"
          class="bg-orange-500 text-white p-2 rounded-lg text-sm">
          Decline
        </button>
        ` : ""}

        <button onclick="editDate('${c.id}')"
          class="bg-blue-600 text-white p-2 rounded-lg text-sm">
          Date
        </button>

        <button onclick="addFunds('${c.id}')"
          class="bg-purple-600 text-white p-2 rounded-lg text-sm">
          Add Funds
        </button>

        <button onclick="deleteCustomer('${c.id}')"
          class="bg-red-600 text-white p-2 rounded-lg text-sm">
          Delete
        </button>

      </div>

    </div>

    `;

  }).join("");

}


/* APPROVE */

window.approveCustomer = async function(id){

  if(!confirm("Approve this customer?")) return;

  try{

    await updateDoc(
      doc(db,"users",id),
      {
        status:"ACTIVE",
        approvedAt:serverTimestamp(),
        approvedBy:currentUser.uid
      }
    );

    await audit(
      "CUSTOMER_APPROVED",
      id
    );

    alert("Customer approved.");
    loadData();

  }catch(error){

    alert("Approve failed: " + error.message);

  }

};


/* DECLINE */

window.declineCustomer = async function(id){

  if(!confirm("Decline this customer?")) return;

  try{

    await updateDoc(
      doc(db,"users",id),
      {
        status:"DECLINED",
        declinedAt:serverTimestamp(),
        declinedBy:currentUser.uid
      }
    );

    await audit(
      "CUSTOMER_DECLINED",
      id
    );

    alert("Customer declined.");
    loadData();

  }catch(error){

    alert("Decline failed: " + error.message);

  }

};


/* EDIT DATE */

window.editDate = function(id){

  const c = customers.find(x=>x.id===id);
  if(!c) return;

  let value="";

  if(c.createdAt?.toDate){
    const d=c.createdAt.toDate();
    value =
      d.getFullYear()+"-"+
      String(d.getMonth()+1).padStart(2,"0")+"-"+
      String(d.getDate()).padStart(2,"0")+"T"+
      String(d.getHours()).padStart(2,"0")+":"+
      String(d.getMinutes()).padStart(2,"0");
  }

  document.getElementById("modalTitle").textContent =
    "Edit Creation Date";

  document.getElementById("modalBody").innerHTML=`

    <input id="newDate"
      type="datetime-local"
      value="${value}"
      class="w-full border rounded-xl p-3">

    <button onclick="saveDate('${id}')"
      class="w-full bg-blue-600 text-white p-3 rounded-xl mt-4">
      Save Date
    </button>

  `;

  document.getElementById("modal").classList.remove("hidden");

};


window.saveDate = async function(id){

  const value=document.getElementById("newDate").value;

  if(!value){
    alert("Select a date.");
    return;
  }

  try{

    const c=customers.find(x=>x.id===id);

    await updateDoc(
      doc(db,"users",id),
      {
        originalCreatedAt:
          c.originalCreatedAt || c.createdAt || serverTimestamp(),

        createdAt:
          Timestamp.fromDate(new Date(value)),

        updatedAt:serverTimestamp(),
        updatedBy:currentUser.uid
      }
    );

    await audit(
      "CUSTOMER_CREATION_DATE_UPDATED",
      id
    );

    closeModal();
    alert("Creation date updated.");
    loadData();

  }catch(error){

    alert("Date update failed: " + error.message);

  }

};


/* ADD FUNDS */

window.addFunds = function(id){

  const account=accounts.find(
    a=>a.userId===id
  );

  if(!account){
    alert("This customer has no account.");
    return;
  }

  document.getElementById("modalTitle").textContent =
    "Add Funds";

  document.getElementById("modalBody").innerHTML=`

    <p class="mb-3">
      Current balance:
      <strong>${money(account.balance)}</strong>
    </p>

    <input id="fundAmount"
      type="number"
      min="0.01"
      step="0.01"
      placeholder="Amount"
      class="w-full border rounded-xl p-3">

    <button onclick="saveFunds('${account.id}')"
      class="w-full bg-purple-600 text-white p-3 rounded-xl mt-4">
      Add Funds
    </button>

  `;

  document.getElementById("modal").classList.remove("hidden");

};


window.saveFunds = async function(accountId){

  const amount =
    Number(document.getElementById("fundAmount").value);

  if(!amount || amount<=0){
    alert("Enter a valid amount.");
    return;
  }

  try{

    const accountRef=doc(db,"accounts",accountId);

    await runTransaction(db,async(transaction)=>{

      const snap=await transaction.get(accountRef);

      if(!snap.exists())
        throw new Error("Account not found.");

      const data=snap.data();

      const oldBalance=Number(data.balance||0);

      const newBalance=oldBalance+amount;

      transaction.update(accountRef,{
        balance:newBalance,
        updatedAt:serverTimestamp()
      });

      const txRef=doc(
        collection(db,"transactions")
      );

      transaction.set(txRef,{
        accountId:accountId,
        userId:data.userId,
        type:"DEPOSIT",
        method:"ADMIN",
        amount:amount,
        balanceBefore:oldBalance,
        balanceAfter:newBalance,
        status:"COMPLETED",
        createdAt:serverTimestamp(),
        createdBy:currentUser.uid
      });

    });

    await audit(
      "ADMIN_ADDED_FUNDS",
      accountId,
      amount
    );

    closeModal();

    alert("Funds added successfully.");
    loadData();

  }catch(error){

    alert("Add funds failed: " + error.message);

  }

};


/* DELETE CUSTOMER */

window.deleteCustomer = async function(id){

  const c=customers.find(x=>x.id===id);

  if(!c) return;

  const ok=confirm(
    "Delete this customer?\n\n" +
    (c.fullName || c.email || id) +
    "\n\nThis cannot be undone."
  );

  if(!ok) return;

  try{

    const customerAccounts =
      accounts.filter(a=>a.userId===id);

    for(const account of customerAccounts){

      await deleteDoc(
        doc(db,"accounts",account.id)
      );

    }

    await deleteDoc(
      doc(db,"users",id)
    );

    await audit(
      "CUSTOMER_DELETED",
      id
    );

    alert("Customer deleted.");
    loadData();

  }catch(error){

    alert("Delete failed: " + error.message);

  }

};


/* AUDIT */

async function audit(action,targetId,amount=null){

  try{

    await addDoc(
      collection(db,"auditLogs"),
      {
        action,
        targetId,
        amount,
        adminId:currentUser.uid,
        adminEmail:currentUser.email,
        timestamp:serverTimestamp()
      }
    );

  }catch(e){

    console.log("Audit log failed:",e.message);

  }

}


/* MODAL */

window.closeModal=function(){
  document.getElementById("modal").classList.add("hidden");
};


/* HELPERS */

function money(value){

  return new Intl.NumberFormat(
    "en-US",
    {
      style:"currency",
      currency:"USD"
    }
  ).format(Number(value||0));

}


function escapeHtml(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
